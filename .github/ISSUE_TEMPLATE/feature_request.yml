name: Feature request
description: Suggest an improvement to the evidence workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the task and what currently gets in your way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the improvement would fit into the current workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Share existing workarounds, related issues or a small fictional example.
